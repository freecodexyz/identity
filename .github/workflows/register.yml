name: Register Identity

# `issues` is the only trigger that runs in THIS repository's context while setting `actor_id` to
# the external account that acted. That is what lets someone prove their GitHub identity without
# installing an app, granting a scope, or touching a repository of their own.
#
# Do not add another trigger. The UIK contract pins `event_name` to `issues`, so tokens minted by
# any other event are rejected on-chain, and `types: [opened]` keeps the title that was validated
# here the same title the issue was created with.
on:
  issues:
    types: [opened]

# `id-token: write` mints the OIDC proof. `issues: write` is only used to report the outcome back.
# `contents` is deliberately absent: nothing in this job reads the repository.
permissions:
  id-token: write
  issues: write

# Anyone on the internet can open an issue here, so serialise per requester.
concurrency:
  group: register-${{ github.actor }}
  cancel-in-progress: false

jobs:
  register:
    name: Prove and register
    runs-on: ubuntu-latest
    steps:
      - name: Parse requested wallet
        id: parse
        env:
          # UNTRUSTED INPUT. Read through the environment and never interpolated into the script
          # body: `${{ github.event.issue.title }}` inside a `run:` block is the standard GitHub
          # Actions script-injection sink.
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          candidate="$(printf '%s' "$ISSUE_TITLE" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"

          case "$candidate" in
            0x*)
              # The contract compares `aud` against `Strings.toHexString`, which is lowercase.
              if printf '%s' "$candidate" | grep -Eq '^0x[0-9a-f]{40}$'; then
                echo "status=ok" >> "$GITHUB_OUTPUT"
                echo "wallet=$candidate" >> "$GITHUB_OUTPUT"
              else
                echo "status=invalid" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              # Not an attempt at a registration; leave ordinary issues alone.
              echo "status=skip" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install Foundry
        if: steps.parse.outputs.status == 'ok'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Prove identity and register
        id: register
        if: steps.parse.outputs.status == 'ok'
        env:
          WALLET: ${{ steps.parse.outputs.wallet }}
          UIK_ADDRESS: ${{ vars.FCF_UIK_ADDRESS }}
          RPC_URL: ${{ vars.FCF_RPC_URL }}
          # Pays gas and nothing else. `register` is permissionless, so this key carries no
          # authority over the registry: draining it costs gas, never an identity.
          PRIVATE_KEY: ${{ secrets.FCF_REGISTRAR_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          for required in UIK_ADDRESS RPC_URL PRIVATE_KEY; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required is not configured."
              exit 1
            fi
          done

          # `audience` binds the proof to the requested wallet. GitHub signs it, so the transaction
          # can only ever mint to the address this issue asked for.
          separator='?'
          case "$ACTIONS_ID_TOKEN_REQUEST_URL" in
            *\?*) separator='&' ;;
          esac

          jwt="$(curl -sS --fail \
            -H "authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=${WALLET}" \
            | jq -r '.value')"

          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "::error::GitHub did not return an OIDC token."
            exit 1
          fi

          # Short-lived and bound to WALLET, but still keep it out of the log.
          echo "::add-mask::$jwt"

          {
            read -r KID_TEXT
            read -r HEADER_HEX
            read -r PAYLOAD_HEX
            read -r SIGNATURE_HEX
            read -r ACTOR_ID
            read -r LOGIN
          } < <(python3 - "$jwt" <<'PY'
          import base64, json, sys

          header_b64, payload_b64, signature_b64 = sys.argv[1].split(".")

          def decode(value):
              return base64.urlsafe_b64decode(value + "=" * (-len(value) % 4))

          header = json.loads(decode(header_b64))
          payload = json.loads(decode(payload_b64))

          # The contract re-hashes `headerB64 . "." . payloadB64` verbatim to check the signature,
          # so those two travel as their ASCII bytes rather than decoded.
          print(header["kid"])
          print("0x" + header_b64.encode().hex())
          print("0x" + payload_b64.encode().hex())
          print("0x" + decode(signature_b64).hex())
          print(payload["actor_id"])
          print(payload["actor"])
          PY
          )

          ARGS=(
            "$UIK_ADDRESS"
            "register(bytes32,bytes,bytes,bytes,uint256,address,string)"
            # The registry keys signing keys by keccak256 of the kid's UTF-8 bytes, exactly as
            # sync-github-keys.sh installs them.
            "$(cast keccak "$KID_TEXT")"
            "$HEADER_HEX" "$PAYLOAD_HEX" "$SIGNATURE_HEX"
            "$ACTOR_ID" "$WALLET" "$LOGIN"
          )

          # Simulate first. A proof that cannot land — already registered, a key not yet synced, an
          # expired token — then costs nothing instead of a reverted transaction.
          cast call "${ARGS[@]}" --rpc-url "$RPC_URL" > /dev/null

          receipt="$(cast send "${ARGS[@]}" --rpc-url "$RPC_URL" --private-key "$PRIVATE_KEY" --json)"
          hash="$(printf '%s' "$receipt" | jq -r '.transactionHash')"
          status="$(printf '%s' "$receipt" | jq -r '.status')"

          if [ "$status" != "0x1" ]; then
            echo "::error::registration transaction $hash reverted"
            exit 1
          fi

          echo "txHash=$hash" >> "$GITHUB_OUTPUT"

      - name: Report outcome
        if: always() && steps.parse.outputs.status != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PARSE_STATUS: ${{ steps.parse.outputs.status }}
          REGISTER_OUTCOME: ${{ steps.register.outcome }}
          WALLET: ${{ steps.parse.outputs.wallet }}
          TX_HASH: ${{ steps.register.outputs.txHash }}
        run: |
          set -euo pipefail

          if [ "$PARSE_STATUS" = "invalid" ]; then
            body="The issue title must be a single \`0x\`-prefixed 20-byte address and nothing else."
          elif [ "$REGISTER_OUTCOME" = "success" ]; then
            body="Registered \`${WALLET}\`."
            if [ -n "${TX_HASH:-}" ]; then
              body="${body}"$'\n\n'"Transaction: \`${TX_HASH}\`"
            fi
            body="${body}"$'\n\n'"Opening another issue with a different address rebinds this identity."
          else
            body="Registration failed. See the workflow run for details, then open a new issue to retry."
          fi

          gh issue comment "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --body "$body"
          gh issue close "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY"
