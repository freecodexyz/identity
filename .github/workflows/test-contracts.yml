name: CI

permissions: {}

on:
  push:
    paths:
      - "tools/**"
      - "bin/**"
      - "sync-github-keys.sh"
      - ".github/workflows/sync-github-keys.yml"
      - "src/**"
      - "test/**"
      - "script/**"
      - "foundry.toml"
      - "remappings.txt"
      - ".github/workflows/test-contracts.yml"
  pull_request:
    paths:
      - "tools/**"
      - "bin/**"
      - "sync-github-keys.sh"
      - ".github/workflows/sync-github-keys.yml"
      - "src/**"
      - "test/**"
      - "script/**"
      - "foundry.toml"
      - "remappings.txt"
      - ".github/workflows/test-contracts.yml"
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      # The test suite signs its JWT fixtures through `vm.ffi` with Node.
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Check deployment configuration
        run: |
          ruby tools/identity/config.test.rb
          bash -n sync-github-keys.sh

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv
